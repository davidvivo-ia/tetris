[project]
name = "tetris"
version = "1.0.0"
description = "Tetris 2026 — reimaginación moderna de un listado BASIC de 1986."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Phosphor 2026" }]
keywords = ["tetris", "game", "tui", "textual", "retro"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Puzzle Games",
]

dependencies = [
  "textual>=0.85",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "structlog>=24.1",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "textual-dev>=1.5",
  "pre-commit>=3.7",
]

[project.scripts]
tetris = "tetris.presentation.cli:app"

[project.urls]
Homepage = "https://github.com/davidvivo-ia/tetris"
Issues = "https://github.com/davidvivo-ia/tetris/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris"]

[tool.hatch.build.targets.wheel.force-include]
"src/tetris/assets" = "tetris/assets"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle/pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "PL",               # pylint subset
  "TID",              # tidy imports
  "ANN",              # annotations
]
ignore = [
  "ANN401",  # Any allowed in narrow places (escapes hatch)
  "E741",    # I, O are canonical Tetris piece names
  "RUF002",  # × en docstrings es intencional
  "PLR0913", # many args (Textual widgets)
  "PLR2004", # magic numbers in domain constants/tests
  "PLR0911", # many returns acceptable in reducers
  "PLR0912", # many branches in reducers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]
"src/tetris/domain/shapes.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tetris"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_unimported = true
pretty = true
plugins = []
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["textual.*", "structlog.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "slow: tests lentos",
  "tui: tests que requieren la TUI",
]

[tool.coverage.run]
source = ["src/tetris"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
